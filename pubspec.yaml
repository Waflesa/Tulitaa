name: pulperia_tulita
description: App offline-first para el control de inventario y precios de la Pulpería Tulita.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.3.3      # SQLite embebido en el dispositivo
  path: ^1.9.0         # Construcción de la ruta de la base de datos
  provider: ^6.1.2     # Gestión de estado (MVVM con ChangeNotifier)
  intl: ^0.19.0        # Formato de moneda (C$)

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
